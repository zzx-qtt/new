name: Auto Update Worker

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 1 * * *" # 每天凌晨1点自动检查更新
  workflow_dispatch:
    inputs:
      force_update:
        description: '是否强制更新（忽略版本检查）'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 获取完整 Git 历史

      - name: 设置环境变量
        run: |
          echo "REPO_OWNER=bia-pain-bache" >> $GITHUB_ENV
          echo "REPO_NAME=BPB-Worker-Panel" >> $GITHUB_ENV
          echo "TARGET_FILE=worker.zip" >> $GITHUB_ENV

      - name: 检查并更新Worker代码
        id: check_update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 日志函数
          log() { echo "[$(date +'%Y-%m-%d %H:%M:%S')] $1"; }

          log "开始检查更新..."

          # 获取本地版本
          LOCAL_VERSION=$(cat version.txt 2>/dev/null || echo "")
          log "本地版本: ${LOCAL_VERSION:-无}"

          # 获取上游仓库最新 Release 信息
          REPO_URL="https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/releases"
          log "获取最新 Release 信息 (${REPO_OWNER}/${REPO_NAME})..."
          RESPONSE=$(curl -s --retry 3 -H "Authorization: token $GITHUB_TOKEN" -H "Accept: application/vnd.github.v3+json" "$REPO_URL")
          if [ $? -ne 0 ]; then
            log "ERROR: 无法访问GitHub API"
            exit 1
          fi

          LATEST_RELEASE=$(echo "$RESPONSE" | jq -r 'if type=="array" and length > 0 then .[0] else empty end')
          TAG_NAME=$(echo "$LATEST_RELEASE" | jq -r '.tag_name // empty')

          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" == "null" ]; then
            log "未在 Releases 中找到记录，尝试检索 Tags..."
            TAGS_RESPONSE=$(curl -s --retry 3 -H "Authorization: token $GITHUB_TOKEN" -H "Accept: application/vnd.github.v3+json" "https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/tags")
            TAG_NAME=$(echo "$TAGS_RESPONSE" | jq -r '.[0].name // empty')
          fi

          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" == "null" ]; then
            log "ERROR: 未能获取到最新 Release 或 Tag 标签"
            exit 1
          fi

          log "最新上游版本: $TAG_NAME"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

          # 判断是否需要更新
          FORCE_UPDATE="${{ github.event.inputs.force_update }}"
          if [ "$LOCAL_VERSION" = "$TAG_NAME" ] && [ "$FORCE_UPDATE" != "true" ]; then
            log "已是最新版本 ($TAG_NAME)，无需更新"
            echo "need_update=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "need_update=true" >> $GITHUB_OUTPUT

          # 检查 Release 中是否有 worker.zip 附件
          DOWNLOAD_URL=$(echo "$LATEST_RELEASE" | jq -r --arg target "$TARGET_FILE" '.assets[]? | select(.name == $target) | .browser_download_url // empty')

          if [ -n "$DOWNLOAD_URL" ] && [ "$DOWNLOAD_URL" != "null" ]; then
            log "找到 $TARGET_FILE 附件，正在下载并解压..."
            wget -q -O "$TARGET_FILE" "$DOWNLOAD_URL"
            unzip -o "$TARGET_FILE"
            rm -f "$TARGET_FILE"
          else
            log "最新版本 ($TAG_NAME) 未包含 $TARGET_FILE 附件，切换为直接下载最新源码包全量覆盖..."
            curl -sL -H "Authorization: token $GITHUB_TOKEN" "https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/tarball/${TAG_NAME}" | tar -xz --strip-components=1
          fi

          # 彻底移除解压出来的上游 .github 文件夹，并精确还原你本地原有的 .github 目录
          log "清理上游工作流文件，保护本地 .github 配置..."
          rm -rf .github
          git checkout HEAD -- .github

          # 写入最新版本号
          echo "$TAG_NAME" > version.txt
          log "更新完成，新版本: $TAG_NAME"

      - name: 提交并推送更改
        if: success() && steps.check_update.outputs.need_update == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "🔄 自动同步Worker版本: ${{ steps.check_update.outputs.tag_name }}"
            git pull --rebase origin main
            git push origin main
          else
            echo "没有检测到文件更新，跳过提交"
          fi
