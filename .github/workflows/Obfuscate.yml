name: Auto Update Worker

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 1 * * *"   # 每天 UTC 1:00（北京时间 9:00）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 初始化仓库
        uses: actions/checkout@v4

      - name: 获取当前本地版本
        id: local
        run: |
          echo -e "\033[34m[获取本地版本]\033[0m"
          if [ -f version.txt ]; then
            LOCAL_VERSION=$(tr -d '[:space:]' < version.txt)
            echo "当前本地版本: $LOCAL_VERSION"
          else
            echo "首次同步，没有本地版本。"
            LOCAL_VERSION=""
          fi
          echo "LOCAL_VERSION=$LOCAL_VERSION" >> "$GITHUB_ENV"

      - name: 获取最新 Release 信息
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo -e "\033[34m[获取最新 Release]\033[0m"
          API_URL="https://api.github.com/repos/bia-pain-bache/BPB-Worker-Panel/releases/latest"
          RESPONSE=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "$API_URL")

          TAG_NAME=$(echo "$RESPONSE" | jq -r '.tag_name')

          # 优先 worker.zip，没有则回退到 worker.js（v5 起只发布 worker.js）
          ASSET=$(echo "$RESPONSE" | jq -r '
            ( [.assets[] | select(.name == "worker.zip")] +
              [.assets[] | select(.name == "worker.js")] )
            | .[0] // empty | "\(.name)\t\(.browser_download_url)"')

          if [ -z "$ASSET" ]; then
            echo -e "\033[31m最新版本 $TAG_NAME 里既没有 worker.zip 也没有 worker.js，退出！\033[0m"
            echo "$RESPONSE" | jq -r '.assets[].name'
            exit 1
          fi

          ASSET_NAME=$(echo "$ASSET" | cut -f1)
          DOWNLOAD_URL=$(echo "$ASSET" | cut -f2)

          echo "最新版本号: $TAG_NAME"
          echo "命中资产: $ASSET_NAME"
          {
            echo "TAG_NAME=$TAG_NAME"
            echo "ASSET_NAME=$ASSET_NAME"
            echo "DOWNLOAD_URL=$DOWNLOAD_URL"
          } >> "$GITHUB_ENV"

      - name: 判断是否需要更新
        run: |
          echo -e "\033[34m[判断是否需要更新]\033[0m"
          if [ "$LOCAL_VERSION" = "$TAG_NAME" ]; then
            echo -e "\033[32m已经是最新版本（$TAG_NAME），无需更新。\033[0m"
            echo "UPDATE_NEEDED=false" >> "$GITHUB_ENV"
          else
            echo -e "\033[33m发现新版本：$LOCAL_VERSION -> $TAG_NAME\033[0m"
            echo "UPDATE_NEEDED=true" >> "$GITHUB_ENV"
          fi

      - name: 清理旧文件并下载新版本
        if: env.UPDATE_NEEDED == 'true'
        run: |
          set -euo pipefail

          echo -e "\033[34m[清理旧产物]\033[0m"
          # 只清理上一次同步下来的产物，绝不动 .git / .github / version.txt
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name 'version.txt' \
            ! -name 'README.md' \
            ! -name 'LICENSE' \
            -exec rm -rf {} +

          echo -e "\033[34m[下载 $ASSET_NAME]\033[0m"
          curl -fsSL -o "$ASSET_NAME" "$DOWNLOAD_URL"

          case "$ASSET_NAME" in
            *.zip)
              echo -e "\033[34m[解压 $ASSET_NAME]\033[0m"
              unzip -o "$ASSET_NAME"
              rm -f "$ASSET_NAME"
              ;;
            *.js)
              echo -e "\033[34m[单文件部署，无需解压]\033[0m"
              ;;
          esac

          echo -e "\033[34m[记录新版本号]\033[0m"
          echo "$TAG_NAME" > version.txt
          ls -al

      - name: 提交更改
        if: env.UPDATE_NEEDED == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🔄 自动同步最新 Worker 版本：${{ env.TAG_NAME }}"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
