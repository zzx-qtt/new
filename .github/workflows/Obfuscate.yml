name: Auto Update and Deploy Worker

on:
  push:
    branches:
      - main

  schedule:
    # 每天 UTC 1:00，即北京时间 9:00
    - cron: "0 1 * * *"

  # 允许在 GitHub Actions 页面手动运行
  workflow_dispatch:

permissions:
  contents: write
  deployments: write

jobs:
  update-and-deploy:
    name: Update and Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 初始化仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 获取当前本地版本
        run: |
          echo -e "\033[34m[获取本地版本]\033[0m"

          if [ -f version.txt ]; then
            LOCAL_VERSION=$(tr -d '[:space:]' < version.txt)
            echo "当前本地版本：$LOCAL_VERSION"
          else
            echo "首次同步，没有本地版本"
            LOCAL_VERSION=""
          fi

          echo "LOCAL_VERSION=$LOCAL_VERSION" >> "$GITHUB_ENV"

      - name: 获取上游最新 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          echo -e "\033[34m[获取上游最新 Release]\033[0m"

          API_URL="https://api.github.com/repos/bia-pain-bache/BPB-Worker-Panel/releases/latest"

          RESPONSE=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API_URL")

          TAG_NAME=$(echo "$RESPONSE" | jq -r '.tag_name // empty')

          if [ -z "$TAG_NAME" ]; then
            echo "错误：无法获得上游版本号"
            echo "$RESPONSE"
            exit 1
          fi

          # 优先下载 worker.zip，如果不存在则下载 worker.js
          ASSET=$(echo "$RESPONSE" | jq -r '
            (
              [.assets[] | select(.name == "worker.zip")] +
              [.assets[] | select(.name == "worker.js")]
            )
            | .[0] // empty
            | "\(.name)\t\(.browser_download_url)"
          ')

          if [ -z "$ASSET" ]; then
            echo "错误：上游版本 $TAG_NAME 中没有 worker.zip 或 worker.js"
            echo "当前 Release 中的文件："
            echo "$RESPONSE" | jq -r '.assets[].name'
            exit 1
          fi

          ASSET_NAME=$(echo "$ASSET" | cut -f1)
          DOWNLOAD_URL=$(echo "$ASSET" | cut -f2)

          echo "上游最新版本：$TAG_NAME"
          echo "下载文件：$ASSET_NAME"

          {
            echo "TAG_NAME=$TAG_NAME"
            echo "ASSET_NAME=$ASSET_NAME"
            echo "DOWNLOAD_URL=$DOWNLOAD_URL"
          } >> "$GITHUB_ENV"

      - name: 判断是否需要更新
        run: |
          echo -e "\033[34m[判断是否需要更新]\033[0m"

          if [ "$LOCAL_VERSION" = "$TAG_NAME" ]; then
            echo -e "\033[32m已经是最新版本：$TAG_NAME\033[0m"
            echo "UPDATE_NEEDED=false" >> "$GITHUB_ENV"
          else
            echo -e "\033[33m发现新版本：${LOCAL_VERSION:-无} → $TAG_NAME\033[0m"
            echo "UPDATE_NEEDED=true" >> "$GITHUB_ENV"
          fi

      - name: 清理旧文件并下载新版本
        if: env.UPDATE_NEEDED == 'true'
        run: |
          set -euo pipefail

          echo -e "\033[34m[清理旧文件]\033[0m"

          # 保留 GitHub Action、版本文件及说明文件
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name 'version.txt' \
            ! -name 'README.md' \
            ! -name 'LICENSE' \
            -exec rm -rf {} +

          echo -e "\033[34m[下载 $ASSET_NAME]\033[0m"

          curl -fL \
            --retry 3 \
            --retry-delay 3 \
            -o "$ASSET_NAME" \
            "$DOWNLOAD_URL"

          case "$ASSET_NAME" in
            *.zip)
              echo -e "\033[34m[解压 $ASSET_NAME]\033[0m"
              unzip -o "$ASSET_NAME"
              rm -f "$ASSET_NAME"
              ;;

            *.js)
              echo -e "\033[34m[处理单文件 Worker]\033[0m"

              # Cloudflare Pages 高级模式要求入口文件名为 _worker.js
              if [ "$ASSET_NAME" != "_worker.js" ]; then
                mv "$ASSET_NAME" "_worker.js"
              fi
              ;;

            *)
              echo "错误：不支持的文件类型：$ASSET_NAME"
              exit 1
              ;;
          esac

          # 如果解压后得到 worker.js，则改名为 _worker.js
          if [ -f "worker.js" ] && [ ! -f "_worker.js" ]; then
            mv "worker.js" "_worker.js"
          fi

          if [ ! -f "_worker.js" ]; then
            echo "错误：更新后没有找到 _worker.js"
            echo "当前目录内容："
            find . -maxdepth 2 -type f -print
            exit 1
          fi

          echo "$TAG_NAME" > version.txt

          echo "更新后的文件："
          ls -al

      - name: 检查 Worker 文件
        run: |
          set -euo pipefail

          if [ -f "_worker.js" ]; then
            echo "找到 _worker.js"
          elif [ -f "worker.js" ]; then
            echo "找到 worker.js，改名为 _worker.js"
            mv "worker.js" "_worker.js"
          else
            echo "错误：仓库中没有 _worker.js 或 worker.js"
            echo "当前文件："
            find . -maxdepth 2 -type f -print
            exit 1
          fi

          FILE_SIZE=$(wc -c < "_worker.js")

          echo "_worker.js 文件大小：$FILE_SIZE 字节"

          if [ "$FILE_SIZE" -lt 1000 ]; then
            echo "错误：_worker.js 文件过小，可能下载失败"
            exit 1
          fi

      - name: 提交上游版本更新
        if: env.UPDATE_NEEDED == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🔄 自动同步 BPB Worker ${{ env.TAG_NAME }}"
          file_pattern: "_worker.js version.txt"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"

      - name: 准备 Cloudflare Pages 部署目录
        run: |
          set -euo pipefail

          rm -rf dist
          mkdir -p dist

          # Pages 高级模式入口
          cp "_worker.js" "dist/_worker.js"

          echo "Cloudflare Pages 部署目录："
          ls -lh dist

          if [ ! -s "dist/_worker.js" ]; then
            echo "错误：dist/_worker.js 不存在或内容为空"
            exit 1
          fi

      - name: 部署到 Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=new --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
