- name: 准备 Pages 部署文件
  run: |
    rm -rf dist
    mkdir -p dist

    if [ -f "_worker.js" ]; then
      cp "_worker.js" "dist/_worker.js"
    elif [ -f "worker.js" ]; then
      cp "worker.js" "dist/_worker.js"
    else
      echo "错误：没有找到 _worker.js 或 worker.js"
      exit 1
    fi

    echo "待部署文件："
    ls -al dist

- name: 部署到 Cloudflare Pages
  uses: cloudflare/wrangler-action@v3
  with:
    apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    command: pages deploy dist --project-name=你的Pages项目名 --branch=main
