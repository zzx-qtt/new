name: Auto Update Worker

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 1 * * *" # 每天凌晨1点自动检查更新
  workflow_dispatch:
    inputs:
      force_update:
        description: '是否强制更新（忽略版本检查）'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 获取完整 Git 历史，方便后续 rebase

      - name: 设置环境变量
        run: |
          echo "REPO_URL=https://api.github.com/repos/bia-pain-bache/BPB-Worker-Panel/releases" >> $GITHUB_ENV
          echo "TARGET_FILE=worker.zip" >> $GITHUB_ENV

      - name: 检查并更新Worker代码
        id: check_update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 日志函数
          log() { echo "[$(date +'%Y-%m-%d %H:%M:%S')] $1"; }

          log "开始检查更新..."

          # 获取本地版本
          LOCAL_VERSION=$(cat version.txt 2>/dev/null || echo "")
          log "本地版本: ${LOCAL_VERSION:-无}"

          # 获取Release信息
          log "获取Release信息..."
          RESPONSE=$(curl -s --retry 3 -H "Authorization: token $GITHUB_TOKEN" -H "Accept: application/vnd.github.v3+json" "$REPO_URL")
          if [ $? -ne 0 ]; then
            log "ERROR: 无法访问GitHub API"
            exit 1
          fi

          # 遍历所有Release，寻找包含目标文件的最新Release
          RELEASE_INFO=$(echo "$RESPONSE" | jq -r --arg target "$TARGET_FILE" '
            first(.[] | select(.assets[]? | .name == $target)) | 
            {tag_name: .tag_name, download_url: (.assets[] | select(.name == $target) | .browser_download_url)}
          ')

          TAG_NAME=$(echo "$RELEASE_INFO" | jq -r '.tag_name // empty')
          DOWNLOAD_URL=$(echo "$RELEASE_INFO" | jq -r '.download_url // empty')

          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" == "null" ] || [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" == "null" ]; then
            log "ERROR: 未在任何 Release 中找到包含 $TARGET_FILE 的版本"
            exit 1
          fi
          log "最新可用版本: $TAG_NAME"

          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

          # 判断是否需要更新
          FORCE_UPDATE="${{ github.event.inputs.force_update }}"
          if [ "$LOCAL_VERSION" = "$TAG_NAME" ] && [ "$FORCE_UPDATE" != "true" ]; then
            log "已是最新版本，无需更新"
            echo "need_update=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "need_update=true" >> $GITHUB_OUTPUT

          # 下载并更新
          log "下载 $TARGET_FILE..."
          wget -q -O "$TARGET_FILE" "$DOWNLOAD_URL"
          log "解压 $TARGET_FILE..."
          unzip -o "$TARGET_FILE"
          rm "$TARGET_FILE"
          echo "$TAG_NAME" > version.txt
          log "更新完成，新版本: $TAG_NAME"

      - name: 提交并推送更改
        if: success() && steps.check_update.outputs.need_update == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "🔄 自动同步Worker版本: ${{ steps.check_update.outputs.tag_name }}"
            # 先 rebase 远程最新提交，避免推送冲突
            git pull --rebase origin main
            git push origin main
          else
            echo "没有检测到文件更新，跳过提交"
          fi
